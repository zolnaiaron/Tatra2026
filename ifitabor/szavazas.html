<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szavazás – Következő Ifitábor</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" onerror="this.remove()">
    
    <!-- Modern Google Fontok: Poppins és Gagalin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gagalin" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-active: rgba(255, 255, 255, 0.22);
            --text-main: #ffffff;
            --text-muted: #cccccc;
            --mountain: #bfe8d2;
            --sea: #b8ddff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-color: #050505;
        }

        /* --- HÁTTÉR ÉS OVERLAY --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../images/szavazas-hatter.jpg');
            background-size: cover;
            background-position: center 55%;
            background-repeat: no-repeat;
            z-index: -2;
            filter: saturate(0.8) brightness(0.7);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 15, 15, 0.7) 0%, rgba(0, 0, 0, 0.9) 100%);
            z-index: -1;
        }

        /* --- TARTALOM KONTÉNER --- */
        .content-wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.28);
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.85);
            content: '';
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .hero h1 {
            font-family: 'Gagalin', sans-serif;
            font-weight: normal; 
            font-size: 3.6rem;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 3px;
            line-height: 1.15;
            background: linear-gradient(to right, #ffffff 0%, #d0d5da 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.8));
        }

        .hero p {
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 560px;
            margin: 0 auto;
        }

        .hero .highlight-badge {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
            color: #f1f1f1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 26px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-left: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input[type="text"]:focus {
            border-color: #fff;
            background: rgba(0, 0, 0, 0.65);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .options-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-left: 5px;
            margin-bottom: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .vote-card {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            padding: 22px 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
        }

        .vote-card:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .vote-card:focus-within {
            outline: 3px solid rgba(255, 255, 255, 0.7);
            outline-offset: 3px;
        }

        .vote-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .vote-card .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            transition: transform 0.2s ease;
        }

        .vote-card .option-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .vote-card .option-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Kijelölt állapot */
        .vote-card.selected {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }

        .vote-card[for="opt_hegy"].selected {
            border-color: var(--mountain);
            background: linear-gradient(145deg, rgba(130, 220, 167, 0.2), rgba(0, 0, 0, 0.36));
            box-shadow: 0 12px 28px rgba(102, 217, 152, 0.18);
        }

        .vote-card[for="opt_tenger"].selected {
            border-color: var(--sea);
            background: linear-gradient(145deg, rgba(121, 189, 255, 0.22), rgba(0, 0, 0, 0.36));
            box-shadow: 0 12px 28px rgba(80, 165, 255, 0.18);
        }

        .vote-card.selected .icon {
            transform: scale(1.15);
        }

        .vote-card .check-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000;
            background: transparent;
            transition: all 0.2s ease;
        }

        .vote-card.selected .check-indicator {
            background: #fff;
            border-color: #fff;
        }

        .submit-btn {
            background: #fff;
            color: #000;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-family: 'Gagalin', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.45);
            background: #eaeaea;
        }

        .submit-btn:focus-visible,
        .input-group input[type="text"]:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.72);
            outline-offset: 3px;
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.8;
            transform: none;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        /* Sikeres vagy figyelmeztető üzenet doboz */
        .form-message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.95rem;
            min-height: 24px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .form-message.show {
            opacity: 1;
        }

        .form-message.error {
            color: #ff6b6b;
        }

        .form-message.success {
            color: #70e000;
        }

        /* --- STATISZTIKA KÁRTYA --- */
        .stats-card {
            margin-top: 30px;
            text-align: center;
            padding: 30px 25px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            opacity: 0;
            width: 100%;
        }

        .stats-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stats-number {
            font-family: 'Gagalin', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
            line-height: 1.1;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* Arány sáv */
        .ratio-bar-wrapper {
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
            display: flex;
            margin-bottom: 12px;
        }

        .ratio-fill-mountains {
            height: 100%;
            background: linear-gradient(90deg, #8ad3a8, var(--mountain));
            width: 50%;
            transition: width 0.6s ease;
        }

        .ratio-fill-sea {
            height: 100%;
            background: linear-gradient(90deg, #70baff, var(--sea));
            width: 50%;
            transition: width 0.6s ease;
        }

        .stats-breakdown {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .breakdown-item strong {
            color: #fff;
        }

        /* --- ANIMÁCIÓK --- */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- RESZPONZIVITÁS --- */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2.5rem; margin-top: 15px; }
            .hero p { font-size: 0.95rem; }
            .glass-card { padding: 30px 20px; }
            .content-wrapper { padding: 40px 15px; }
            .stats-number { font-size: 2.8rem; }
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .submit-btn { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- Háttér és Overlay -->
    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="content-wrapper">
        
        <!-- Hero Szekció -->
        <header class="hero">
            <div class="eyebrow">2027 · táborhelyszín</div>
            <h1>Következő Ifitábor</h1>
            <p>A következő ifitábor is ehhez hasonló lesz mint a mostani Tátra ifitábor, és az ára max. 40.000 Ft lesz, amiben benne van a fullos szállás és az utazás.</p>
        </header>

        <!-- Szavazó Űrlap -->
        <div class="glass-card">
            <form id="campVoteForm">
                <div class="form-section">
                    
                    <!-- 1. Mező: Név -->
                    <div class="input-group">
                        <label for="userName">Mi a neved? *</label>
                        <input type="text" id="userName" name="userName" placeholder="Írd be a teljes neved..." required autocomplete="name">
                    </div>

                    <!-- 2. Mező: Helyszín választás kártyák -->
                    <div>
                        <div class="options-title">Hol legyen az ifitábor? *</div>
                        <div class="options-grid">
                            
                            <!-- Hegyekben opció -->
                            <label class="vote-card" for="opt_hegy">
                                <span class="check-indicator">✓</span>
                                <input type="radio" id="opt_hegy" name="destination" value="Hegyekben" required>
                                <span class="icon">🏔️</span>
                                <span class="option-name">Hegyekben</span>
                                <span class="option-desc">Túrák, friss levegő & panoráma</span>
                            </label>

                            <!-- Tengerparton opció -->
                            <label class="vote-card" for="opt_tenger">
                                <span class="check-indicator">✓</span>
                                <input type="radio" id="opt_tenger" name="destination" value="Tengerparton">
                                <span class="icon">🌊</span>
                                <span class="option-name">Tengerparton</span>
                                <span class="option-desc">Hullámok, napfény & strandolás</span>
                            </label>

                        </div>
                    </div>

                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Szavazás leadása</span>
                    <div class="spinner"></div>
                </button>

                <div id="formMessage" class="form-message"></div>
            </form>
        </div>

        <!-- Statisztika Kártya -->
        <div class="stats-card">
            <div class="stats-title">Eddig leadott szavazatok</div>
            <div class="stats-number" id="statsTotal">...</div>

            <!-- Arány sáv -->
            <div class="ratio-bar-wrapper">
                <div class="ratio-fill-mountains" id="barMountain" style="width: 50%;"></div>
                <div class="ratio-fill-sea" id="barSea" style="width: 50%;"></div>
            </div>

            <!-- Részletes arányok -->
            <div class="stats-breakdown">
                <div class="breakdown-item">
                    🏔️ Hegyekben: <strong id="countMountain">0</strong> (<span id="pctMountain">50%</span>)
                </div>
                <div class="breakdown-item">
                    🌊 Tengerparton: <strong id="countSea">0</strong> (<span id="pctSea">50%</span>)
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('campVoteForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const formMessage = document.getElementById('formMessage');
            
            const statsTotal = document.getElementById('statsTotal');
            const countMountain = document.getElementById('countMountain');
            const countSea = document.getElementById('countSea');
            const pctMountain = document.getElementById('pctMountain');
            const pctSea = document.getElementById('pctSea');
            const barMountain = document.getElementById('barMountain');
            const barSea = document.getElementById('barSea');
            
            const voteCards = document.querySelectorAll('.vote-card');
            const radioButtons = document.querySelectorAll('input[name="destination"]');

            // Google Apps Script végpont URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxBzOxYEyPmlYgy7UM1hRYE_IqCYsxmXKg1BBpWtK_Un_X_tLri6McFNjfqi-ece2MnVA/exec';

            voteCards.forEach(card => {
                const radio = card.querySelector('input[type="radio"]');
                card.addEventListener('click', () => {
                    voteCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    radio.checked = true;
                });
            });

            function updateDisplayStats(mountainCount, seaCount) {
                const total = mountainCount + seaCount;
                statsTotal.innerText = total;
                countMountain.innerText = mountainCount;
                countSea.innerText = seaCount;

                if (total === 0) {
                    pctMountain.innerText = '50%';
                    pctSea.innerText = '50%';
                    barMountain.style.width = '50%';
                    barSea.style.width = '50%';
                } else {
                    const mPct = Math.round((mountainCount / total) * 100);
                    const sPct = 100 - mPct;
                    pctMountain.innerText = mPct + '%';
                    pctSea.innerText = sPct + '%';
                    barMountain.style.width = mPct + '%';
                    barSea.style.width = sPct + '%';
                }
            }

            // Statisztika lekérdezése a szerverről / tárolóból
            function fetchVoteStats() {
                // Alapértelmezett helyi mentésből vagy backendről
                let localVotes = JSON.parse(localStorage.getItem('obgyifi_szavazas_data') || '{"hegy": 0, "tenger": 0}');
                
                fetch(scriptURL + '?type=szavazas')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.total !== undefined) {
                            const m = Number(data.hegyekben || 0);
                            const s = Number(data.tengerparton || 0);
                            updateDisplayStats(m, s);
                        } else if (data && data.count !== undefined) {
                            statsTotal.innerText = data.count;
                        } else {
                            updateDisplayStats(localVotes.hegy, localVotes.tenger);
                        }
                    })
                    .catch(err => {
                        console.log("Hálózati lekérés hiba, fallback helyi nézetre:", err);
                        updateDisplayStats(localVotes.hegy, localVotes.tenger);
                    });
            }

            fetchVoteStats();

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const nameInput = document.getElementById('userName');
                const selectedDestination = document.querySelector('input[name="destination"]:checked');

                const name = nameInput.value.trim();
                if (!name) {
                    showMessage("Kérlek add meg a neved!", "error");
                    nameInput.focus();
                    return;
                }

                if (!selectedDestination) {
                    showMessage("Kérlek válaszd ki a helyszínt!", "error");
                    return;
                }

                submitBtn.classList.add('loading');
                showMessage("", "");

                // Form adatok összeállítása
                const formData = new FormData();
                formData.append('Nev', name);
                formData.append('Helyszin', selectedDestination.value);
                formData.append('Tipus', 'Szavazas');
                formData.append('Idopont', new Date().toLocaleString('hu-HU'));

                // Beküldés a Google Táblázatba / Scriptbe
                // A Google Apps Script POST-válasza egyes böngészőkben CORS-korlátozott.
                // A no-cors móddal maga a szavazat biztosan eljut a Scripthez.
                fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
                    .then(() => {
                        onSuccessSubmission(selectedDestination.value);
                    })
                    .catch(err => {
                        console.warn("Beküldési hiba:", err);
                        submitBtn.classList.remove('loading');
                        showMessage("A szavazatot most nem sikerült elküldeni. Kérlek próbáld újra!", "error");
                    });
            });

            function onSuccessSubmission(chosenPlace) {
                submitBtn.classList.remove('loading');
                btnText.innerText = 'Köszönjük a szavazatod!';
                submitBtn.style.background = '#333';
                submitBtn.style.color = '#fff';

                showMessage("A szavazatodat sikeresen rögzítettük!", "success");

                // Helyi számláló növelése és frissítése
                let localVotes = JSON.parse(localStorage.getItem('obgyifi_szavazas_data') || '{"hegy": 0, "tenger": 0}');
                if (chosenPlace === 'Hegyekben') {
                    localVotes.hegy += 1;
                } else {
                    localVotes.tenger += 1;
                }
                localStorage.setItem('obgyifi_szavazas_data', JSON.stringify(localVotes));
                updateDisplayStats(localVotes.hegy, localVotes.tenger);

                setTimeout(() => {
                    form.reset();
                    voteCards.forEach(c => c.classList.remove('selected'));
                    btnText.innerText = 'Szavazás leadása';
                    submitBtn.style.background = '#fff';
                    submitBtn.style.color = '#000';
                    formMessage.classList.remove('show');
                }, 4000);
            }

            function showMessage(msg, type) {
                if (!msg) {
                    formMessage.innerText = '';
                    formMessage.className = 'form-message';
                    return;
                }
                formMessage.innerText = msg;
                formMessage.className = `form-message show ${type}`;
            }
        });
    </script>
</body>
</html>
