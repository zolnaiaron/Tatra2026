<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Program - Tátra 2026</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gagalin" rel="stylesheet">

    <style>
        /* --- ALAP BEÁLLÍTÁSOK --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            -ms-overflow-style: none;  
            scrollbar-width: none;  
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        *::-webkit-scrollbar {
            display: none !important; 
        }

        /* --- HÁTTÉR ÉS ÜVEG EFFEKTUS --- */
        .background-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            z-index: 0;
            filter: grayscale(70%); 
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1;
        }

        /* --- FŐ TARTALOM --- */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            position: relative;
        }

        h1 {
            font-family: 'Gagalin', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff 0%, #aaa 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* --- ÚJ: IDŐJÁRÁS WIDGET --- */
        #weather-widget {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 15px; /* Helykihagyás a subtitle alatt */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .weather-icon {
            font-size: 1.3rem;
        }

        /* --- ADMIN GOMB --- */
        .admin-toggle {
            display: none; 
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .admin-toggle:hover, .admin-toggle.active {
            background: #fff;
            color: #000;
        }

        /* --- NAPOK ÉS KÁRTYÁK --- */
        .day-section {
            width: 100%;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease forwards;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .day-title {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .add-btn {
            display: none; 
            background: #fff;
            color: #000;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .add-btn:hover { transform: scale(1.05); }
        .admin-mode .add-btn { display: block; }

        .program-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .program-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            transition: transform 0.2s, background 0.3s, border-color 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .program-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- AKTUÁLIS PROGRAM ZÖLD KIEMELÉSE --- */
        .program-card.active-event {
            background: rgba(144, 238, 144, 0.15); 
            border: 1px solid rgba(144, 238, 144, 0.6);
            box-shadow: 0 0 20px rgba(144, 238, 144, 0.15);
        }
        .program-card.active-event::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10%;
            height: 80%;
            width: 4px;
            background-color: #90ee90;
            border-radius: 0 5px 5px 0;
            box-shadow: 0 0 10px rgba(144, 238, 144, 0.5);
        }

        .program-card.dragging {
            opacity: 0.5;
            transform: scale(0.98);
            border: 1px dashed #fff;
        }

        .drag-handle {
            display: none;
            cursor: grab;
            margin-right: 15px;
            font-size: 1.2rem;
            opacity: 0.5;
        }
        .admin-mode .drag-handle { display: block; }

        .time {
            font-family: 'Gagalin', sans-serif;
            font-size: 1.5rem;
            min-width: 80px;
            letter-spacing: 1px;
        }

        .details {
            flex-grow: 1;
            padding-left: 15px;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            margin-left: 15px;
        }

        .details h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .details p {
            font-size: 0.85rem;
            opacity: 0.7;
            font-style: italic;
        }

        .actions {
            display: none;
            gap: 10px;
        }
        .admin-mode .actions { display: flex; }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover { background: #fff; color: #000; }
        .action-btn.delete:hover { background: #fff; color: #000; border-color: #fff; }

        /* --- MODAL (Szerkesztés / Hozzáadás) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .modal-content h2 {
            font-family: 'Gagalin', sans-serif;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .close-modal:hover { opacity: 1; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Gagalin', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .save-btn:hover { transform: translateY(-2px); }

        #sync-status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* --- ÚJ: ALVÁS KÉPERNYŐ (OVERLAY) --- */
        #sleep-screen {
            display: none; /* Javascript kapcsolja be */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: #000000;
            color: #ffffff;
            z-index: 99999; /* Minden felett! */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 2s ease-in-out; /* 2 másodperc alatt halványul el */
        }

        #sleep-screen h2 {
            font-family: 'Gagalin', sans-serif;
            font-size: 4rem;
            letter-spacing: 3px;
            text-align: center;
            margin: 20px 0;
        }
        
        #sleep-screen p {
            font-size: 1.2rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            #sleep-screen h2 { font-size: 2.5rem; }
            .program-card { flex-direction: column; align-items: flex-start; }
            .time { margin-bottom: 10px; }
            .details { border-left: none; padding-left: 0; margin-left: 0; width: 100%; }
            .actions { position: absolute; top: 15px; right: 15px; }
            .drag-handle { position: absolute; top: 20px; right: 60px; margin: 0; }
        }
    </style>
    <!-- Ideiglenes karbantartási nézet: az eredeti oldal kódja változatlanul megmarad. -->
    <style>
        body { min-height: 100vh !important; margin: 0 !important; background: #000 !important; }
        body > * { display: none !important; }
        body::after {
            content: "Karbantartás alatt...\A A 2027 táborra optimalizálás\A Regisztráció kezdete: 2027. február 15.";
            white-space: pre-line;
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-content: center;
            padding: 2rem;
            background: #000;
            color: #fff;
            font: 600 clamp(1.35rem, 4vw, 2.5rem)/1.5 Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ÚJ: ALVÁS KÉPERNYŐ -->
    <div id="sleep-screen">
        <h2>Alvás van<br>gyermekem</h2>
        <p>Jó éjszakát!</p>
    </div>

    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="content" id="app-content">
        <header>
            <button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">Admin Mód: KI</button>
            <h1>Program</h1>
            <div class="subtitle">2026. augusztus 9–13. • Tátra</div>
            
            <!-- ÁTHELYEZVE: IDŐJÁRÁS DOBOZ -->
            <div id="weather-widget">
                <span class="weather-icon" id="w-icon">⏳</span>
                <span id="w-text">Időjárás betöltése...</span>
            </div>
        </header>

        <div id="schedule-container">
            <!-- Ide töltődnek be az adatok a Google Sheets-ből -->
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Esemény Szerkesztése</h2>
            <form id="programForm" onsubmit="saveEvent(event)">
                <input type="hidden" id="eventId">
                
                <div class="form-group">
                    <label>Nap</label>
                    <select id="eventDay" required>
                        <option value="Vasárnap">Vasárnap</option>
                        <option value="Hétfő">Hétfő</option>
                        <option value="Kedd">Kedd</option>
                        <option value="Szerda">Szerda</option>
                        <option value="Csütörtök">Csütörtök</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Időpont (pl. 08:30 vagy Délelőtt)</label>
                    <input type="text" id="eventTime" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Program neve</label>
                    <input type="text" id="eventTitle" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Tanító / Felelős (opcionális)</label>
                    <input type="text" id="eventTeacher" autocomplete="off">
                </div>

                <button type="submit" class="save-btn">Mentés adatbázisba</button>
            </form>
        </div>
    </div>

    <div id="sync-status">Szinkronizálás...</div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwWLOs344ncRZsbaZq6y1K8qaQnbDz-ob6VR8kvzlyhM0bay2LhQmr6PV8OVa7jRu2jVQ/exec';

        // --- ÚJ: ALVÁS KÉPERNYŐ ELLENŐRZÉSE ---
        function checkSleepTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();

            // 23:59-től reggel 6:00-ig
            if ((hours === 23 && minutes >= 59) || (hours >= 0 && hours < 6)) {
                const sleepScreen = document.getElementById('sleep-screen');
                sleepScreen.style.display = 'flex'; // Megjelenik

                // Vár 8 másodpercet, utána kezdi elhalványítani
                setTimeout(() => {
                    sleepScreen.style.opacity = '0';
                    // 2 másodperc (a CSS transition ideje) múlva teljesen kiveszi a DOM-ból
                    setTimeout(() => {
                        sleepScreen.style.display = 'none';
                    }, 2000);
                }, 8000); 
            }
        }

        // --- ÚJ: FELSŐERDŐFALVA IDŐJÁRÁS ---
        async function fetchWeather() {
            try {
                // Felsőerdőfalva (Stará Lesná) koordinátái: 49.12, 20.31
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=49.12&longitude=20.31&current_weather=true');
                const data = await response.json();
                
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                
                // Időjárás kódok átalakítása emojivá
                let icon = "🌤️";
                if (code === 0) icon = "☀️"; // Tiszta ég
                else if (code >= 1 && code <= 3) icon = "⛅"; // Felhős
                else if (code >= 45 && code <= 48) icon = "🌫️"; // Köd
                else if (code >= 51 && code <= 67) icon = "🌧️"; // Eső
                else if (code >= 71 && code <= 77) icon = "❄️"; // Hó
                else if (code >= 80 && code <= 82) icon = "🌦️"; // Zápor
                else if (code >= 95) icon = "⛈️"; // Vihar

                document.getElementById('w-icon').innerText = icon;
                document.getElementById('w-text').innerText = `Felsőerdőfalva: ${temp}°C`;
            } catch (error) {
                console.error("Hiba az időjárás betöltésekor", error);
                document.getElementById('w-icon').innerText = "🏔️";
                document.getElementById('w-text').innerText = "Felsőerdőfalva időjárása nem elérhető";
            }
        }

        // 1. ADATBÁZIS
        let scheduleData = []; 
        const daysOrder = ["Vasárnap", "Hétfő", "Kedd", "Szerda", "Csütörtök"];
        let isAdmin = false;

        const tripDates = {
            "Vasárnap": "2026-08-09",
            "Hétfő": "2026-08-10",
            "Kedd": "2026-08-11",
            "Szerda": "2026-08-12",
            "Csütörtök": "2026-08-13"
        };

        const normalizeTime = (t) => {
            if (!t) return "99:99"; 
            if (t === "00:00") return "24:00"; 
            if (t.includes(':')) {
                let parts = t.split(':');
                let hour = parts[0].trim().padStart(2, '0');
                let min = parts[1].trim().padStart(2, '0');
                return `${hour}:${min}`;
            }
            return t; 
        };

        function updateActiveEvent() {
            const now = new Date();
            const currentYMD = now.getFullYear() + "-" +
                               String(now.getMonth() + 1).padStart(2, '0') + "-" +
                               String(now.getDate()).padStart(2, '0');
            const currentTimeStr = String(now.getHours()).padStart(2, '0') + ":" +
                                   String(now.getMinutes()).padStart(2, '0');

            let todayName = null;
            for (let [dayName, dateStr] of Object.entries(tripDates)) {
                if (dateStr === currentYMD) {
                    todayName = dayName;
                    break;
                }
            }

            document.querySelectorAll('.program-card').forEach(card => card.classList.remove('active-event'));

            if (!todayName) return; 

            let todaysEvents = scheduleData.filter(e => e.day === todayName);
            todaysEvents.sort((a, b) => normalizeTime(a.time).localeCompare(normalizeTime(b.time)));

            let activeEventId = null;

            for (let i = 0; i < todaysEvents.length; i++) {
                let ev = todaysEvents[i];
                let evTime = normalizeTime(ev.time);
                
                if (evTime === "99:99" || !evTime.includes(':')) continue; 

                if (currentTimeStr >= evTime) {
                    activeEventId = ev.id;
                } else {
                    break; 
                }
            }

            if (activeEventId !== null) {
                let activeCard = document.querySelector(`.program-card[data-id='${activeEventId}']`);
                if (activeCard) {
                    activeCard.classList.add('active-event');
                }
            }
        }

        async function checkIpAndShowAdminButton() {
            try {
                let ipResponse = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipResponse.json();
                let userIp = ipData.ip;

                let checkResponse = await fetch(scriptURL + '?type=checkIp&ip=' + encodeURIComponent(userIp));
                let checkData = await checkResponse.json();

                if (checkData.allowed === true) {
                    document.getElementById("adminToggle").style.display = "block";
                }
            } catch (error) {
                console.error("IP ellenőrzési hiba:", error);
            }
        }

        function fetchSchedule() {
            const container = document.getElementById("schedule-container");
            if (scheduleData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:50px; font-size: 1.2rem;">Adatok betöltése...</div>';
            }

            fetch(scriptURL + '?type=program')
                .then(response => response.json())
                .then(data => {
                    scheduleData = data;
                    renderApp(); 
                })
                .catch(error => {
                    console.error("Hiba a betöltéskor:", error);
                    if (scheduleData.length === 0) {
                        container.innerHTML = '<div style="text-align:center; color:#ff4d4d;">Hiba történt az adatok betöltésekor. Ellenőrizd az URL-t!</div>';
                    }
                });
        }

        function renderApp() {
            const container = document.getElementById("schedule-container");
            container.innerHTML = "";

            daysOrder.forEach(day => {
                let dayEvents = scheduleData.filter(e => e.day === day);
                dayEvents.sort((a, b) => normalizeTime(a.time).localeCompare(normalizeTime(b.time)));

                if (dayEvents.length === 0 && !isAdmin) return;

                const dayDiv = document.createElement("div");
                dayDiv.className = "day-section";
                
                let html = `
                    <div class="day-header">
                        <div class="day-title">${day}</div>
                        <button class="add-btn" onclick="openModal(null, '${day}')">+ Új esemény</button>
                    </div>
                    <div class="program-list" id="list-${day}">
                `;

                dayEvents.forEach(ev => {
                    html += `
                        <div class="program-card" draggable="${isAdmin}" data-id="${ev.id}" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event, '${day}')">
                            <div class="drag-handle">☰</div>
                            <div class="time">${ev.time}</div>
                            <div class="details">
                                <h3>${ev.title}</h3>
                                ${ev.teacher ? `<p>Tanító: ${ev.teacher}</p>` : ''}
                            </div>
                            <div class="actions">
                                <button class="action-btn" onclick="openModal(${ev.id})" title="Szerkesztés">✎</button>
                                <button class="action-btn delete" onclick="deleteEvent(${ev.id})" title="Törlés">✕</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                dayDiv.innerHTML = html;
                container.appendChild(dayDiv);
            });

            updateActiveEvent();
        }

        async function toggleAdmin() {
            const btn = document.getElementById("adminToggle");
            const app = document.getElementById("app-content");
            
            if (isAdmin) {
                isAdmin = false;
                btn.innerText = "Admin Mód: KI";
                btn.classList.remove("active");
                app.classList.remove("admin-mode");
                renderApp();
                return;
            }

            let pwd = prompt("jelszo");
            if (!pwd) return; 

            try {
                btn.innerText = "Ellenőrzés...";
                let response = await fetch(scriptURL + '?type=verifyAdmin&pwd=' + encodeURIComponent(pwd));
                let result = await response.json();
                
                if (result.success === true) {
                    isAdmin = true;
                    btn.innerText = "Admin Mód: BE";
                    btn.classList.add("active");
                    app.classList.add("admin-mode");
                    renderApp();
                } else {
                    btn.innerText = "Admin Mód: KI";
                    alert("Helytelen jelszó!");
                }
            } catch (error) {
                console.error("Hiba a jelszó ellenőrzésekor:", error);
                btn.innerText = "Admin Mód: KI";
                alert("Hiba történt a szerverrel való kommunikáció során.");
            }
        }

        function openModal(id = null, defaultDay = "Vasárnap") {
            const modal = document.getElementById("editModal");
            const title = document.getElementById("modalTitle");
            
            if (id) {
                const ev = scheduleData.find(e => e.id === id);
                document.getElementById("eventId").value = ev.id;
                document.getElementById("eventDay").value = ev.day;
                document.getElementById("eventTime").value = ev.time;
                document.getElementById("eventTitle").value = ev.title;
                document.getElementById("eventTeacher").value = ev.teacher;
                title.innerText = "Esemény Szerkesztése";
            } else {
                document.getElementById("programForm").reset();
                document.getElementById("eventId").value = "";
                document.getElementById("eventDay").value = defaultDay;
                title.innerText = "Új Esemény";
            }
            modal.classList.add("active");
        }

        function closeModal() {
            document.getElementById("editModal").classList.remove("active");
        }

        function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById("eventId").value;
            const newEvent = {
                id: id ? parseInt(id) : Date.now(),
                day: document.getElementById("eventDay").value,
                time: document.getElementById("eventTime").value,
                title: document.getElementById("eventTitle").value,
                teacher: document.getElementById("eventTeacher").value
            };

            if (id) {
                const index = scheduleData.findIndex(ev => ev.id === parseInt(id));
                scheduleData[index] = newEvent;
            } else {
                scheduleData.push(newEvent);
            }

            closeModal();
            renderApp();
            syncWithExcel();
        }

        function deleteEvent(id) {
            if (confirm("Biztosan törölni szeretnéd ezt a programpontot?")) {
                scheduleData = scheduleData.filter(e => e.id !== id);
                renderApp();
                syncWithExcel();
            }
        }

        let draggedId = null;

        function dragStart(e) {
            draggedId = parseInt(e.target.getAttribute('data-id'));
            e.target.classList.add('dragging');
        }

        function dragOver(e) { e.preventDefault(); }

        function drop(e, targetDay) {
            e.preventDefault();
            const draggedCard = document.querySelector('.dragging');
            if (draggedCard) draggedCard.classList.remove('dragging');

            const targetCard = e.target.closest('.program-card');
            if (!targetCard || draggedId === null) return;

            const targetId = parseInt(targetCard.getAttribute('data-id'));
            if (draggedId === targetId) return;

            alert("Mivel a rendszer szigorúan időrendi sorrendet használ, a kártya áthelyezéséhez kérlek frissítsd az esemény időpontját a felugró ablakban!");
            const ev = scheduleData.find(e => e.id === draggedId);
            ev.day = targetDay;
            openModal(draggedId, targetDay);
        }

        function syncWithExcel() {
            const status = document.getElementById("sync-status");
            status.innerText = "Mentés a Táblázatba...";
            status.style.opacity = "1";

            fetch(scriptURL + '?action=saveProgram', {
                method: 'POST',
                body: JSON.stringify(scheduleData)
            })
            .then(response => response.json())
            .then(result => {
                if(result.result === "success") {
                    status.innerText = "Sikeresen szinkronizálva! ✅";
                } else {
                    status.innerText = "Hiba a mentés során ❌";
                }
                setTimeout(() => { status.style.opacity = "0"; }, 2000);
            })
            .catch(error => {
                console.error(error);
                status.innerText = "Hálózati hiba mentéskor ❌";
                setTimeout(() => { status.style.opacity = "0"; }, 3000);
            });
        }

        // --- FŐ INDÍTÁSI FOLYAMATOK ---
        checkSleepTime(); 
        fetchWeather();
        checkIpAndShowAdminButton();
        fetchSchedule();

        setInterval(() => {
            if (document.getElementById("editModal").classList.contains("active") || draggedId !== null) return;

            fetch(scriptURL + '?type=program')
                .then(response => response.json())
                .then(data => {
                    if (JSON.stringify(data) !== JSON.stringify(scheduleData)) {
                        scheduleData = data;
                        renderApp();
                    }
                })
                .catch(error => console.error("Háttérfrissítési hiba:", error));
        }, 10000); 

        setInterval(updateActiveEvent, 60000);

    </script>
</body>
</html>
