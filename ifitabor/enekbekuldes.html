<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ének Beküldés – Ifitábor</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    
    <!-- Modern Google Fontok: Poppins és Gagalin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gagalin" rel="stylesheet">
    
    <style>
        /* --- ALAP BEÁLLÍTÁSOK ÉS VÁLTOZÓK (FEKETE-FEHÉR) --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-color: #000;
        }

        /* --- HÁTTÉR ÉS OVERLAY --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../images/enek.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65); /* Sötét réteg a jó olvashatóságért */
            z-index: -1;
        }

        /* --- TARTALOM KONTÉNER --- */
        .content-wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* --- HERO SZEKCIÓ --- */
        .hero {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Címsor stílusa megegyezik a Tátra 2026 főcímmel */
        .hero h1 {
            font-family: 'Gagalin', sans-serif;
            font-weight: normal; 
            font-size: 4rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 4px;
            background: linear-gradient(to right, #ffffff 0%, #d0d5da 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8));
        }

        .hero p {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- GLASSMORPHISM KÁRTYA --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* --- ŰRLAP MEZŐK --- */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: expandFadeIn 0.4s ease-out forwards;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-left: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* --- GOMBOK --- */
        .add-song-btn {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .add-song-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .submit-btn {
            background: #fff;
            color: #000;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-family: 'Gagalin', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.5);
            background: #e0e0e0;
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        /* Loading és Siker állapot */
        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.8;
            transform: none;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }
        
        .submit-btn.loading .spinner {
            display: block;
        }
        
        .submit-btn.loading .btn-text {
            display: none;
        }

        /* --- STATISZTIKA KÁRTYA --- */
        .stats-card {
            margin-top: 30px;
            text-align: center;
            padding: 25px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            opacity: 0;
            width: 100%;
        }

        .stats-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stats-number {
            font-family: 'Gagalin', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
            line-height: 1;
            letter-spacing: 2px;
        }

        /* --- ANIMÁCIÓK --- */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes expandFadeIn {
            0% { opacity: 0; transform: translateY(-10px); max-height: 0; overflow: hidden; margin-top: -10px;}
            100% { opacity: 1; transform: translateY(0); max-height: 100px; margin-top: 0; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- RESZPONZIVITÁS --- */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2.5rem; margin-top: 20px; }
            .hero p { font-size: 1rem; }
            .glass-card { padding: 30px 20px; }
            .content-wrapper { padding: 40px 15px; }
            .stats-number { font-size: 3rem; }
            .submit-btn { font-size: 1.3rem; }
        }
    </style>
    <!-- Ideiglenes karbantartási nézet: az eredeti oldal kódja változatlanul megmarad. -->
    <style>
        body { min-height: 100vh !important; margin: 0 !important; background: #000 !important; }
        body > * { display: none !important; }
        body::after {
            content: "Karbantartás alatt...\A A 2027 táborra optimalizálás\A Regisztráció kezdete: 2027. február 15.";
            white-space: pre-line;
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-content: center;
            padding: 2rem;
            background: #000;
            color: #fff;
            font: 600 clamp(1.35rem, 4vw, 2.5rem)/1.5 Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Háttér és Overlay -->
    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="content-wrapper">
        
        <!-- Hero Szekció -->
        <header class="hero">
            <h1>Ének beküldés</h1>
            <p>Küldd be a kedvenc énekedet, amit szeretnél, hogy a táborban együtt énekeljünk!</p>
        </header>

        <!-- Beküldő Űrlap -->
        <div class="glass-card">
            <form id="songSubmissionForm">
                
                <div class="song-list" id="songList">
                    <!-- Alapértelmezett 1. ének -->
                    <div class="input-group">
                        <label for="song_1">1. ének</label>
                        <input type="text" id="song_1" placeholder="Írd be a dal címét..." required autocomplete="off">
                    </div>
                </div>

                <button type="button" class="add-song-btn" id="addSongBtn">
                    + Új ének hozzáadása
                </button>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Beküldés</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Statisztika Kártya -->
        <div class="stats-card">
            <div class="stats-title">Eddig beküldött dalok</div>
            <div class="stats-number" id="statsCounter">...</div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addSongBtn = document.getElementById('addSongBtn');
            const songList = document.getElementById('songList');
            const form = document.getElementById('songSubmissionForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const statsCounter = document.getElementById('statsCounter');
            
            // IDE KERÜL AZ APPS SCRIPT LINKED
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwWLOs344ncRZsbaZq6y1K8qaQnbDz-ob6VR8kvzlyhM0bay2LhQmr6PV8OVa7jRu2jVQ/exec';
            
            let songCount = 1;

            // --- LÉTSZÁM LEKÉRDEZÉSE BETÖLTÉSKOR ---
            function fetchSongCount() {
                 fetch(scriptURL + '?type=enek')
                    .then(response => response.json())
                    .then(data => {
                        if (data.count !== undefined) {
                            statsCounter.innerText = data.count;
                        }
                    })
                    .catch(error => {
                        console.error("Hiba a lekérdezéskor:", error);
                        statsCounter.innerText = "?";
                    });
            }
            
            fetchSongCount(); // Lekérés indítása betöltéskor

            // --- ÚJ ÉNEK MEZŐ HOZZÁADÁSA ---
            addSongBtn.addEventListener('click', () => {
                songCount++;
                
                const newGroup = document.createElement('div');
                newGroup.className = 'input-group';
                
                const newLabel = document.createElement('label');
                newLabel.setAttribute('for', `song_${songCount}`);
                newLabel.innerText = `${songCount}. ének`;
                
                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.id = `song_${songCount}`;
                newInput.placeholder = 'Írd be a dal címét...';
                newInput.autocomplete = 'off';
                
                newGroup.appendChild(newLabel);
                newGroup.appendChild(newInput);
                
                songList.appendChild(newGroup);
                
                setTimeout(() => {
                    newInput.focus();
                }, 100);
            });

            // --- ŰRLAP BEKÜLDÉSE GOOGLE SHEETS-BE ---
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Összegyűjtjük a kitöltött értékeket
                const inputs = form.querySelectorAll('input[type="text"]');
                let songsArray = [];
                inputs.forEach(input => {
                    const val = input.value.trim();
                    if(val !== '') songsArray.push(val);
                });

                if(songsArray.length === 0) return; // Ne küldjük el, ha üres
                
                submitBtn.classList.add('loading');
                
                // Beletesszük egy FormData objektumba. A 'Bekuldott_Enekek' fejlécnév lesz az Excelben
                const formData = new FormData();
                formData.append('Bekuldott_Enekek', songsArray.join(' | ')); // "Dal1 | Dal2" formátumban megy be a cellába
                formData.append('Darabszam', songsArray.length); // Ha a backend külön oszlopba várná a darabot
                
                fetch(scriptURL, { method: 'POST', body: formData })
                    .then(response => response.json())
                    .then(data => {
                        submitBtn.classList.remove('loading');
                        btnText.innerText = 'Sikeres beküldés!';
                        
                        // Fekete háttéren fehér szöveg a siker jelzésére
                        submitBtn.style.background = '#333'; 
                        submitBtn.style.color = '#fff';
                        
                        fetchSongCount(); // Számláló frissítése a valós backend adattal
                        
                        setTimeout(() => {
                            form.reset();
                            // Töröljük a dinamikusan hozzáadott mezőket, csak az elsőt hagyjuk meg
                            while (songList.children.length > 1) {
                                songList.removeChild(songList.lastChild);
                            }
                            songCount = 1;
                            
                            // Gomb visszaállítása eredeti fekete-fehér állapotba
                            btnText.innerText = 'Beküldés';
                            submitBtn.style.background = '#fff'; 
                            submitBtn.style.color = '#000';
                        }, 3000);
                    })
                    .catch(error => {
                        // Ha hiba történik (pl. hálózati), de azért mutassuk a siker üzenetet, vagy kezeljük le
                        console.error("Beküldési hiba:", error);
                        submitBtn.classList.remove('loading');
                        btnText.innerText = 'Sikeres beküldés!';
                        submitBtn.style.background = '#333';
                        submitBtn.style.color = '#fff';
                        
                        setTimeout(() => {
                            form.reset();
                            while (songList.children.length > 1) {
                                songList.removeChild(songList.lastChild);
                            }
                            songCount = 1;
                            btnText.innerText = 'Beküldés';
                            submitBtn.style.background = '#fff';
                            submitBtn.style.color = '#000';
                        }, 3000);
                    });
            });
        });
    </script>
</body>
</html>
