<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263847">
  <title>Szolgálat – OBGY IFI</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/gagalin" rel="stylesheet">
  <style>
    :root { --glass: rgba(22, 37, 49, .68); --line: rgba(237, 248, 255, .35); --muted: rgba(239, 247, 252, .82); }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: #fff; font-family: Poppins, sans-serif; background: #263847; }
    body::before { position: fixed; z-index: -2; inset: 0; background: url('../images/szolgalat-hatter.jpg') 40% center / cover no-repeat; content: ''; }
    body::after { position: fixed; z-index: -1; inset: 0; background: linear-gradient(110deg, rgba(12, 27, 39, .62), rgba(25, 52, 68, .22) 55%, rgba(9, 22, 32, .58)), radial-gradient(circle at 57% 35%, transparent, rgba(9, 22, 32, .35)); content: ''; }
    main { width: min(100% - 32px, 720px); margin: 0 auto; padding: 58px 0; }
    header { text-align: center; margin-bottom: 28px; animation: enter .7s ease-out both; }
    .eyebrow { display: inline-flex; align-items: center; gap: .5rem; padding: .45rem .8rem; border: 1px solid var(--line); border-radius: 99px; background: rgba(15, 35, 49, .45); font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow::before { width: .45rem; height: .45rem; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff; content: ''; }
    h1 { margin: 15px 0 11px; font-family: Gagalin, Poppins, sans-serif; font-size: clamp(2.5rem, 7vw, 4rem); font-weight: 400; letter-spacing: .07em; line-height: 1; text-shadow: 0 4px 14px rgba(0, 0, 0, .7); }
    header p { max-width: 560px; margin: 0 auto; color: var(--muted); font-size: 1.02rem; line-height: 1.6; }
    .card { padding: clamp(22px, 6vw, 40px); border: 1px solid var(--line); border-radius: 24px; background: var(--glass); box-shadow: 0 20px 44px rgba(0, 0, 0, .42); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: enter .7s .15s ease-out both; }
    .group { margin-bottom: 25px; }
    label, .options-title { display: block; margin: 0 0 8px 4px; font-size: .95rem; font-weight: 500; }
    input[type=text] { width: 100%; padding: 15px 18px; border: 1px solid rgba(255,255,255,.36); border-radius: 15px; outline: 0; color: #fff; background: rgba(7, 21, 31, .48); font: inherit; }
    input[type=text]::placeholder { color: rgba(255,255,255,.55); }
    input[type=text]:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .option { position: relative; min-height: 147px; padding: 19px 15px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; background: rgba(7, 21, 31, .38); cursor: pointer; text-align: center; transition: transform .2s, background .2s, border-color .2s; }
    .option:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.68); background: rgba(204, 232, 246, .16); }
    .option.selected { border-color: #fff; background: rgba(195, 229, 244, .24); box-shadow: 0 0 18px rgba(200, 237, 255, .25); }
    .option input { position: absolute; opacity: 0; }
    .icon { display: block; margin-bottom: 5px; font-size: 2.2rem; }
    .name { display: block; font-size: 1.05rem; font-weight: 600; }
    .description { display: block; margin-top: 4px; color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .other { grid-column: 1 / -1; min-height: 112px; }
    .other-input { display: none; margin-top: 15px; }
    .other-input.visible { display: block; }
    button { width: 100%; padding: 17px; border: 0; border-radius: 15px; color: #163044; background: #f2f9fc; box-shadow: 0 5px 17px rgba(226, 245, 255, .3); cursor: pointer; font: 400 1.35rem/1 Gagalin, Poppins, sans-serif; letter-spacing: .08em; transition: transform .2s, filter .2s; }
    button:hover { transform: translateY(-2px); filter: brightness(.94); }
    button:disabled { cursor: wait; opacity: .76; transform: none; }
    .message { min-height: 1.5em; margin: 13px 0 0; text-align: center; font-size: .92rem; font-weight: 500; }
    .message.error { color: #ffd0ca; } .message.success { color: #dbffd2; }
    @keyframes enter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 560px) { main { width: min(100% - 24px, 720px); padding: 38px 0; } .options { grid-template-columns: 1fr; } .other { grid-column: auto; } .option { min-height: auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">OBGY IFI · Szolgálat</span>
      <h1>Jelentkezés szolgálatra</h1>
      <p>Válaszd ki azt a területet, ahol szívesen becsatlakoznál és segítenéd az ifi életét!</p>
    </header>
    <section class="card" aria-label="Szolgálati jelentkezési űrlap">
      <form id="service-form">
        <div class="group"><label for="name">Mi a neved? *</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Írd be a teljes neved..." required></div>
        <fieldset class="group" style="border:0;padding:0;margin-left:0;margin-right:0"><legend class="options-title">Melyik területen szolgálnál szívesen? *</legend><div class="options" id="options">
          <label class="option"><input type="radio" name="area" value="Tanítás / Igei buzdítás" required><span class="icon">📖</span><span class="name">Tanítás / Buzdítás</span><span class="description">Igei gondolatok megosztása az ifis alkalmakon.</span></label>
          <label class="option"><input type="radio" name="area" value="Dicsőítés"><span class="icon">🎸</span><span class="name">Dicsőítés</span><span class="description">Heti próba, készülés az alkalmakra és táborokra.</span></label>
          <label class="option"><input type="radio" name="area" value="Kommunikáció"><span class="icon">💬</span><span class="name">Kommunikáció</span><span class="description">Meghívás, szolgálók szervezése, Messenger.</span></label>
          <label class="option"><input type="radio" name="area" value="Insta posztok"><span class="icon">📱</span><span class="name">Insta posztok</span><span class="description">Keresztény tartalmak készítése és megosztása.</span></label>
          <label class="option other"><input type="radio" name="area" value="Egyéb"><span class="icon">✨</span><span class="name">Egyéb / Más ötlet</span><span class="description">Írd le, hogy miben segítenél!</span></label>
        </div><div class="other-input" id="other-wrap"><label for="other">Milyen egyéb szolgálatra gondoltál? *</label><input id="other" type="text" placeholder="Kérlek, írd le részletesebben..."></div></fieldset>
        <button id="submit" type="submit">Jelentkezés elküldése</button><p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector('#service-form'), cards = document.querySelectorAll('.option'), otherWrap = document.querySelector('#other-wrap'), other = document.querySelector('#other'), submit = document.querySelector('#submit'), message = document.querySelector('#message');
    const endpoint = 'https://script.google.com/macros/s/AKfycbyAOhbc5Jg3UmK3pe0t50-Fty7gUg26RYsoCUB4COC82zsRld86GtxycpWqm1V52QJh0w/exec';
    document.querySelector('#options').addEventListener('change', event => { const isOther = event.target.value === 'Egyéb'; cards.forEach(card => card.classList.toggle('selected', card.contains(event.target))); otherWrap.classList.toggle('visible', isOther); other.required = isOther; if (!isOther) other.value = ''; if (isOther) other.focus(); });
    form.addEventListener('submit', async event => { event.preventDefault(); const area = form.elements.area.value; if (area === 'Egyéb' && !other.value.trim()) { other.focus(); return; } submit.disabled = true; submit.textContent = 'Küldés...'; message.className = 'message'; message.textContent = ''; const data = new FormData(); data.append('Nev', form.elements.name.value.trim()); data.append('Szolgalati_terulet', area === 'Egyéb' ? `Egyéb: ${other.value.trim()}` : area); data.append('Tipus', 'Szolgalat_Jelentkezes'); data.append('Idopont', new Date().toLocaleString('hu-HU')); try { await fetch(endpoint, { method: 'POST', body: data }); form.reset(); cards.forEach(card => card.classList.remove('selected')); otherWrap.classList.remove('visible'); other.required = false; message.textContent = 'A jelentkezésedet sikeresen rögzítettük!'; message.classList.add('success'); } catch { message.textContent = 'Jelenleg hiba történt. Kérlek, próbáld újra később!'; message.classList.add('error'); } finally { submit.disabled = false; submit.textContent = 'Jelentkezés elküldése'; } });
  </script>
</body>
</html>
